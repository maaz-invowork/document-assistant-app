[project]
name = "doc-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maaz-invowork", email = "maaz.khan@invowork.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.33.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.4",
]

[project.scripts]
doc-assistant = "doc_assistant:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
